<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>OUT RUN CLASSIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; touch-action: none; }
  #c { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; image-rendering: crisp-edges; }
  body.touch.portrait #c { top: 8px; transform: translateX(-50%); }
  #touch { position: fixed; inset: 0; display: none; pointer-events: none; }
  #touch div { position: absolute; width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.16);
    border: 2px solid rgba(255,255,255,.5); color: #fff; font: bold 15px Arial; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; -webkit-tap-highlight-color: transparent; }
  #touch div.on { background: rgba(255,212,0,.45); }
  #touch .b1 { bottom: calc(20px + env(safe-area-inset-bottom)); }
  #touch .b2 { bottom: calc(102px + env(safe-area-inset-bottom)); }
  body.touch #touch { display: block; }
</style>
</head>
<body>
<canvas id="c" width="320" height="224"></canvas>
<div id="touch">
  <div id="tLeft" class="b1" style="left:16px">◀</div>
  <div id="tRight" class="b1" style="left:100px">▶</div>
  <div id="tBrake" class="b1" style="right:100px">BRAKE</div>
  <div id="tGas" class="b1" style="right:16px">GAS</div>
  <div id="tGear" class="b2" style="right:16px">GEAR</div>
</div>
<script>
'use strict';
// ════════════════════════════════════════════════════════════════════
//  OUT RUN CLASSIC — 원작(1986)과 같은 방식: 320×224 도트 화면 + 의사 3D 도로 + 스프라이트 확대
//  (그래픽·음악은 원작 데이터가 아니라 같은 스타일로 직접 그린/만든 것)
// ════════════════════════════════════════════════════════════════════
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 320, H = 224, CY = 136, VS = H - 10 - CY;      // 수평선 높이, 세로 투영 배율
const SEG_LEN = 200, RUMBLE_LEN = 3, ROAD_W = 2200, LANES = 6, CAM_H = 1000;
const CAM_DEPTH = 1 / Math.tan(50 * Math.PI / 180), PLAYER_Z = CAM_H * CAM_DEPTH, DRAW_DIST = 260;
const SPRITE_SCALE = 0.25 / 96;
const MAX_SPEED = SEG_LEN * 60, GEAR_MAX = [MAX_SPEED * 198 / 293, MAX_SPEED];
const STAGE_SEGS = 2100, FORK = 420, LEVELS = 5, START_TIME = 75, EXTEND = [62, 60, 58, 56];
let seed = 1986;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5);
const overlap = (x1, w1, x2, w2) => !((x1 + w1 / 2) < (x2 - w2 / 2) || (x1 - w1 / 2) > (x2 + w2 / 2));
// ════════════════════════════ 도트 스프라이트 (코드로 직접 그림) ════════════════════════════
function spr(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const P = (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), ww, hh); };
  const C = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(Math.round(x), Math.round(y), r, 0, 7); g.fill(); };
  draw(g, P, C);
  return c;
}
function flipX(src) { return spr(src.width, src.height, g => { g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); }); }

// 야자수: 휘어진 줄기(마디 무늬) + 축 늘어진 잎
function makePalm(lean, sd) {
  let s = sd; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return spr(110, 150, (g, P, C) => {
    const bx = 55, top = 40, cx = bx + lean;
    for (let y = 149; y >= top; y--) {
      const t = (149 - y) / (149 - top), x = bx + lean * t * t, w = 8 - t * 3.2;
      P(x - w / 2, y, w, 1, '#b8915c');
      P(x - w / 2, y, 2, 1, '#e0c08a');
      P(x + w / 2 - 2, y, 2, 1, '#7a5630');
      if (y % 5 === 0) P(x - w / 2, y, w, 1, '#8a6438');
    }
    const fr = [[-175, 40], [-150, 42], [-128, 30], [-105, 22], [-78, 22], [-52, 32], [-28, 42], [-5, 40], [160, 34], [20, 30]];
    const drawFrond = ([a, L], dark) => {
      const ar = a * Math.PI / 180;
      for (let k = 0; k <= L; k++) {
        const t = k / L, px = cx + Math.cos(ar) * L * t, py = top + Math.sin(ar) * L * t * 0.55 + L * 0.8 * t * t;
        const len = 9 * (1 - t * 0.55);
        for (const sd2 of [-1, 1]) for (let q = 1; q <= len; q++) {
          const lx = px + sd2 * q * 0.45 + Math.cos(ar) * q * 0.25, ly = py + q * 0.85;
          P(lx, ly, 1, 1, dark ? '#16501e' : q < 3 ? '#1f6a2a' : (q + k) % 4 === 0 ? '#5cbf48' : '#2f9a3a');
        }
        P(px, py, 2, 1, dark ? '#103a16' : '#2a7a2a');
      }
    };
    fr.filter((_, k) => k % 2).forEach(f => drawFrond([f[0] + 8, f[1] * 0.9], true));
    fr.forEach(f => drawFrond([f[0] + (r() - 0.5) * 6, f[1]], false));
    for (let k = 0; k < 4; k++) C(cx - 3 + k * 2, top + 3 + (k % 2) * 2, 2.2, '#7a5020');
  });
}
const shadowImg = spr(80, 10, g => { g.fillStyle = 'rgba(40,40,60,0.35)'; g.beginPath(); g.ellipse(40, 5, 40, 5, 0, 0, 7); g.fill(); });
function makeBush(col0, col1, col2, sd) {
  let s = sd; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return spr(56, 30, (g, P, C) => {
    const bl = []; for (let k = 0; k < 16; k++) bl.push([6 + r() * 44, 10 + r() * 14, 4 + r() * 6]);
    bl.forEach(([x, y, rr]) => C(x + 1, y + 2, rr, col0));
    bl.forEach(([x, y, rr]) => C(x, y, rr, col1));
    bl.forEach(([x, y, rr]) => { C(x - rr * 0.3, y - rr * 0.4, rr * 0.45, col2); });
    for (let k = 0; k < 40; k++) P(4 + r() * 48, 6 + r() * 20, 1, 1, k % 2 ? col0 : col2);
  });
}
function makeTree(c0, c1, c2, sd) {
  let s = sd; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return spr(64, 84, (g, P, C) => {
    P(28, 48, 8, 36, '#6a4424'); P(28, 48, 2, 36, '#8a6038');
    const bl = []; for (let k = 0; k < 20; k++) bl.push([10 + r() * 44, 12 + r() * 36, 6 + r() * 8]);
    bl.forEach(([x, y, rr]) => C(x + 1, y + 2, rr, c0));
    bl.forEach(([x, y, rr]) => C(x, y, rr, c1));
    bl.forEach(([x, y, rr]) => C(x - rr * 0.35, y - rr * 0.4, rr * 0.4, c2));
  });
}
function makePine(snow) {
  return spr(44, 92, (g, P) => {
    P(19, 74, 6, 18, '#5a3a20');
    for (let y = 4; y < 78; y++) {
      const band = (y - 4) % 18, w = (band + 4) * 1.15 + (y - 4) * 0.18;
      P(22 - w, y, w * 2, 1, '#1f5a34'); P(22 - w, y, w * 0.7, 1, '#2f7a44');
      if (snow && band < 4) P(22 - w * 0.8, y, w * 1.6, 1, '#f4f8fa');
    }
  });
}
const cactusImg = spr(36, 60, (g, P) => {
  const col = (x, y, w, h) => { P(x, y, w, h, '#3f8a3a'); P(x, y, 2, h, '#6cbf58'); P(x + w - 2, y, 2, h, '#2a6026'); };
  col(14, 6, 8, 54); col(4, 22, 6, 16); P(4, 36, 12, 5, '#3f8a3a'); col(26, 16, 6, 18); P(20, 32, 12, 5, '#3f8a3a');
  P(16, 4, 4, 3, '#3f8a3a');
});
function makeRock(c0, c1, c2) {
  return spr(64, 40, g => {
    g.fillStyle = c0; g.beginPath(); g.moveTo(2, 40); g.lineTo(8, 14); g.lineTo(22, 4); g.lineTo(40, 6); g.lineTo(56, 18); g.lineTo(62, 40); g.fill();
    g.fillStyle = c1; g.beginPath(); g.moveTo(10, 38); g.lineTo(12, 16); g.lineTo(24, 8); g.lineTo(34, 12); g.lineTo(30, 38); g.fill();
    g.fillStyle = c2; g.beginPath(); g.moveTo(40, 40); g.lineTo(44, 20); g.lineTo(56, 22); g.lineTo(60, 40); g.fill();
  });
}
const columnImg = spr(24, 96, (g, P) => {
  P(0, 0, 24, 8, '#e8e0cc'); P(0, 0, 24, 2, '#fff'); P(2, 8, 20, 4, '#d0c6ae');
  for (let x = 3; x < 21; x++) P(x, 12, 1, 78, x % 3 === 0 ? '#bdb39a' : x < 9 ? '#fbf6e8' : '#e6dcc6');
  P(0, 88, 24, 8, '#d8ceb6');
});
function makeCliff(sd) {
  let s = sd; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return spr(80, 140, (g, P) => {
    const top = 10 + r() * 20;
    for (let x = 0; x < 80; x++) {
      const t = top + Math.sin(x * 0.2 + sd) * 6;
      for (let y = Math.round(t); y < 140; y++) {
        const band = Math.floor((y + Math.sin(x * 0.15) * 4) / 9) % 3;
        P(x, y, 1, 1, band === 0 ? '#c8784a' : band === 1 ? '#a85a34' : '#8a4628');
      }
      P(x, t, 1, 2, '#e0986a');
    }
    for (let k = 0; k < 60; k++) P(r() * 80, 30 + r() * 110, 2, 1, '#6a3420');
  });
}
// Gateway: 스톤헨지풍 돌문 (길 전체를 가로지름)
const gateImg = spr(240, 110, (g, P) => {
  const stone = (x, y, w, h) => { P(x, y, w, h, '#a8a090'); P(x, y, 3, h, '#d0c8b4'); P(x + w - 4, y, 4, h, '#7a7262'); for (let k = y + 6; k < y + h; k += 11) P(x + 3, k, w - 7, 1, '#958d7c'); };
  stone(4, 22, 26, 88); stone(210, 22, 26, 88); stone(0, 4, 240, 20);
  P(0, 22, 240, 2, '#6a6252');
});
function makeBanner(text, color) {
  return spr(260, 96, (g, P) => {
    P(6, 8, 8, 88, '#d8d8d8'); P(6, 8, 2, 88, '#fff'); P(246, 8, 8, 88, '#d8d8d8'); P(246, 8, 2, 88, '#fff');
    P(0, 0, 260, 34, color); P(0, 0, 260, 2, 'rgba(255,255,255,.6)'); P(0, 32, 260, 2, 'rgba(0,0,0,.4)');
    for (let x = 0; x < 260; x += 8) for (let y = 34; y < 42; y += 4) P(x + ((y / 4) % 2) * 4, y, 4, 4, '#111');
    g.font = '16px "Press Start 2P", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#000'; g.fillText(text, 131, 19); g.fillStyle = '#fff'; g.fillText(text, 130, 18);
  });
}
function makeSign(a, b) {
  return spr(200, 60, (g, P) => {
    P(30, 30, 6, 30, '#888'); P(164, 30, 6, 30, '#888');
    P(0, 0, 200, 34, '#1f5fd0'); P(2, 2, 196, 30, '#fff'); P(4, 4, 192, 26, '#1f5fd0');
    g.font = '8px "Press Start 2P", monospace'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    g.textAlign = 'left'; g.fillText('◀ ' + a, 8, 17); g.textAlign = 'right'; g.fillText(b + ' ▶', 192, 17);
  });
}
const CLOTH = ['#ff3b3b', '#2a62d8', '#f0c020', '#1f9a5a', '#ffffff', '#ff7ab0', '#7a3fc0', '#ff8a20'];
function makeCrowd(frame, sd) {
  let s = sd; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return spr(80, 40, (g, P, C) => {
    for (let k = 0; k < 8; k++) {
      const x = 4 + k * 9 + r() * 3, up = (k + frame) % 2, cl = CLOTH[Math.floor(r() * CLOTH.length)], sk = r() < 0.7 ? '#f0c49a' : '#a86d4a';
      P(x, 24, 7, 10, cl); P(x + 1, 34, 2, 6, '#2a3a6a'); P(x + 4, 34, 2, 6, '#2a3a6a');
      C(x + 3.5, 20 - up, 3, sk); P(x + 1, 16 - up, 5, 2, ['#2a1a0e', '#ffd860', '#6a3a14'][k % 3]);
      if (up) { P(x - 2, 14, 2, 10, cl); P(x + 7, 14, 2, 10, cl); } else { P(x - 2, 24, 2, 8, cl); P(x + 7, 24, 2, 8, cl); }
    }
  });
}
function makeFlagman(frame) {
  return spr(40, 56, (g, P, C) => {
    P(14, 26, 10, 16, '#ffffff'); P(15, 42, 3, 14, '#222'); P(20, 42, 3, 14, '#222');
    C(19, 20, 4, '#f0c49a'); P(15, 15, 8, 3, '#1a1a1a'); P(16, 20, 6, 2, '#111');
    const up = frame === 0;
    if (up) { P(23, 10, 3, 16, '#fff'); P(25, 0, 1, 12, '#ccc'); for (let y = 0; y < 3; y++) for (let x = 0; x < 4; x++) P(26 + x * 3, 1 + y * 3, 3, 3, (x + y) % 2 ? '#111' : '#fff'); }
    else { P(24, 26, 10, 3, '#fff'); P(33, 27, 6, 1, '#ccc'); for (let y = 0; y < 3; y++) for (let x = 0; x < 4; x++) P(26 + x * 3, 30 + y * 3, 3, 3, (x + y) % 2 ? '#111' : '#fff'); }
    P(11, 26, 3, 12, '#fff');
  });
}
const windmillImg = spr(60, 96, (g, P) => {
  g.fillStyle = '#f0ece0'; g.beginPath(); g.moveTo(20, 96); g.lineTo(24, 30); g.lineTo(36, 30); g.lineTo(40, 96); g.fill();
  P(26, 30, 3, 66, '#fff'); P(34, 30, 3, 66, '#c8c0b0');
  g.fillStyle = '#9a4a2a'; g.beginPath(); g.moveTo(20, 32); g.lineTo(30, 18); g.lineTo(40, 32); g.fill();
  g.strokeStyle = '#d8d0bc'; g.lineWidth = 4;
  for (let b = 0; b < 4; b++) { const a = b * Math.PI / 2 + 0.4; g.beginPath(); g.moveTo(30, 28); g.lineTo(30 + Math.cos(a) * 28, 28 + Math.sin(a) * 28); g.stroke(); }
  P(28, 26, 4, 4, '#555');
});
function makeBillboard(text, bg) {
  return spr(80, 52, (g, P) => {
    P(14, 30, 4, 22, '#777'); P(62, 30, 4, 22, '#777');
    P(0, 0, 80, 32, '#eee'); P(2, 2, 76, 28, bg);
    g.font = '8px "Press Start 2P", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.fillText(text, 40, 17);
  });
}

// 일반 차량 (뒷모습)
function makeCar(body, dark, type) {
  if (type === 'truck') return spr(56, 64, (g, P) => {
    P(2, 2, 52, 50, '#f2f2f2'); P(2, 2, 52, 3, '#fff'); P(2, 20, 52, 6, body); P(50, 2, 4, 50, '#c8c8c8');
    P(4, 52, 48, 4, '#333'); P(6, 54, 6, 3, '#f33'); P(44, 54, 6, 3, '#f33');
    P(4, 56, 12, 8, '#111'); P(40, 56, 12, 8, '#111'); P(22, 54, 12, 5, '#eee');
  });
  if (type === 'bug') return spr(40, 30, (g, P, C) => {
    P(2, 22, 8, 8, '#111'); P(30, 22, 8, 8, '#111');
    g.fillStyle = body; g.beginPath(); g.ellipse(20, 16, 18, 12, 0, Math.PI, 0); g.fill(); P(2, 14, 36, 10, body);
    P(8, 6, 24, 6, '#2a3a4a'); P(10, 7, 6, 2, '#6a8aaa');
    P(4, 16, 5, 4, '#f33'); P(31, 16, 5, 4, '#f33'); P(15, 19, 10, 4, '#eee'); P(2, 22, 36, 2, dark);
  });
  return spr(48, 30, (g, P) => {
    P(3, 22, 9, 8, '#111'); P(36, 22, 9, 8, '#111');
    P(6, 2, 36, 10, body); P(9, 3, 30, 7, '#2a3a4a'); P(11, 4, 8, 2, '#6a8aaa');
    P(1, 11, 46, 13, body); P(1, 11, 46, 2, 'rgba(255,255,255,.35)'); P(1, 22, 46, 2, dark);
    P(3, 14, 8, 4, '#ff3030'); P(37, 14, 8, 4, '#ff3030'); P(18, 16, 12, 5, '#eee');
  });
}

// 플레이어 차: 빨간 테스타로사 스파이더 뒷모습 + 운전자(갈색 머리, 파란 셔츠) + 금발 동승자
function makePlayer(lean, hair, brake) {
  return spr(100, 60, (g, P, C) => {
    const L = lean * 2, T = lean * 3;
    const RED = '#e02222', RED_D = '#a81414', RED_DD = '#760c0c', RED_L = '#ff6a5a';
    // 타이어
    for (const tx of [6 - L * 0.5, 78 - L * 0.5]) { P(tx, 40, 16, 20, '#121212'); for (let y = 42; y < 60; y += 3) P(tx + 1, y, 14, 1, '#2c2c2c'); P(tx + 2, 40, 3, 20, '#2a2a2a'); }
    // 윈드실드 프레임 (사람보다 뒤)
    P(20 + T, 10, 60, 2, '#1a1a1a'); P(20 + T, 10, 2, 9, '#1a1a1a'); P(78 + T, 10, 2, 9, '#1a1a1a');
    P(22 + T, 12, 56, 6, 'rgba(140,180,210,0.45)');
    // 차체 (뒤 펜더가 넓은 형태)
    for (let y = 16; y < 50; y++) {
      const hw = y < 22 ? 36 + (y - 16) * 1.6 : y < 46 ? 46 : 46 - (y - 46) * 1.5, sh = Math.round((y < 30 ? L : L * 0.5));
      P(50 - hw + sh, y, hw * 2, 1, y < 19 ? RED_L : y < 22 ? RED : y > 44 ? RED_D : RED);
      P(50 - hw + sh, y, 3, 1, RED_DD); P(50 + hw - 3 + sh, y, 3, 1, RED_DD);
      if (y >= 19 && y < 22) P(50 - hw + 4 + sh, y, hw * 2 - 8, 1, RED_L);
    }
    // 리어 데크 엔진 루버
    for (let y = 17; y < 22; y += 2) P(36 + L, y, 28, 1, RED_D);
    // 검은 리어 패널 + 가로 루버 + 루버 사이로 보이는 테일램프
    P(12 + L * 0.5, 25, 76, 14, '#141414');
    for (let y = 25; y < 39; y++) {
      if ((y - 25) % 3 === 0) { P(12 + L * 0.5, y, 76, 1, '#3c3c3c'); continue; }
      const lc = brake ? '#ff7070' : '#ff2a2a';
      P(14 + L * 0.5, y, 18, 1, lc); P(68 + L * 0.5, y, 18, 1, lc);
    }
    P(48 + L * 0.5, 27, 4, 6, '#ffd400'); P(49 + L * 0.5, 28, 2, 3, '#222');
    // 범퍼, 번호판, 머플러
    P(40 + L * 0.5, 40, 20, 7, '#f2f2f2'); for (let x = 42; x < 58; x += 3) P(x + L * 0.5, 42, 2, 3, '#333');
    for (const ex of [18, 25, 70, 77]) { C(ex + L * 0.5, 47, 2.6, '#aaaaaa'); C(ex + L * 0.5, 47, 1.3, '#222'); }
    // 미러
    P(2 + T, 14, 7, 4, RED); P(8 + T, 16, 4, 2, RED_D); P(91 + T, 14, 7, 4, RED); P(88 + T, 16, 4, 2, RED_D);
    // 시트 헤드레스트
    P(30 + T, 8, 12, 8, '#e8dcc0'); P(58 + T, 8, 12, 8, '#e8dcc0');
    // 운전자 (왼쪽)
    P(29 + T, 11, 15, 6, '#3a62d0'); P(29 + T, 11, 15, 1, '#5a82f0');
    C(36 + T, 6, 5.5, '#6a3a14'); C(35 + T, 4, 3, '#8a5228'); P(34 + T, 10, 4, 2, '#e8b088');
    // 금발 동승자 (오른쪽) — 머리카락이 바람에 날림
    P(57 + T, 12, 14, 5, '#ff8ab0'); P(57 + T, 12, 14, 1, '#ffb0cc');
    C(64 + T, 6, 5.5, '#ffd040'); C(63 + T, 4, 3, '#ffe890');
    const wave = [0, 1, 2][hair];
    for (let k = 0; k < 6; k++) {
      const yy = 6 + k * 1.6, len = 6 + k + (k + wave) % 3 * 2;
      P(68 + T, yy, len, 2, k % 2 ? '#e8b020' : '#ffd040');
    }
  });
}
const playerImgs = [-1, 0, 1].map(l => [0, 1, 2].map(h => [false, true].map(b => makePlayer(l, h, b))));

  txt(String(kmh).padStart(3, ' '), 12, H - 34, '#ff5418', 16);
  txt('km/h', 64, H - 28, '#ff8840');
  const rpm = clamp(speed / GEAR_MAX[gear], 0, 1), lit = Math.round(rpm * 18);
  for (let k = 0; k < 18; k++) { ctx.fillStyle = '#000'; ctx.fillRect(13 + k * 5, H - 13, 4, 7); ctx.fillStyle = k < lit ? (k > 14 ? '#ff4040' : k > 10 ? '#ffd800' : '#5cff8a') : '#9aa0c0'; ctx.fillRect(12 + k * 5, H - 14, 4, 7); }
  txt(gear ? 'HI' : 'LO', 106, H - 15, gear ? '#ff4040' : '#ffffff');
  // 스테이지 + 체커기
  txt('STAGE', W - 92, H - 22, '#ffe600', 8);
  txt(String(curStage.level + 1), W - 44, H - 26, '#ffffff', 16);
  for (let yy = 0; yy < 3; yy++) for (let xx = 0; xx < 5; xx++) { ctx.fillStyle = (xx + yy) % 2 ? '#111' : '#fff'; ctx.fillRect(W - 24 + xx * 3, H - 25 + yy * 3, 3, 3); }
  ctx.strokeStyle = '#fff'; ctx.strokeRect(W - 24.5, H - 25.5, 16, 10);
  // 메시지
  if (state === 'countdown') txt(cdT > 3 ? 'READY' : String(Math.ceil(cdT - 0.2)), W / 2, 70, '#ffd800', 16, 'center');
  if (msgT > 0) { txt(msgA, W / 2, 62, '#ffd800', msgA.length > 12 ? 8 : 16, 'center'); txt(msgB, W / 2, 86, '#ffffff', 8, 'center'); }
  if ((state === 'over' || state === 'goal') && overT > 1.5) txt('PRESS ENTER', W / 2, 104, '#ffffff', 8, 'center');
}
function drawTitle() {
  txt('OUT RUN', W / 2, 30, '#ff3020', 24, 'center', '#ffe000');
  txt('CLASSIC', W / 2, 58, '#ffffff', 8, 'center');
  // 라디오 (SELECT MUSIC BY STEERING)
  const rx = 16, ry = 146, rw = W - 32, rh = 58;
  txt('SELECT MUSIC BY STEERING', W / 2, ry - 14, '#ffd800', 8, 'center');
  ctx.fillStyle = '#000'; ctx.fillRect(rx + 2, ry + 2, rw, rh);
  ctx.fillStyle = '#3a3a40'; ctx.fillRect(rx, ry, rw, rh); ctx.fillStyle = '#5a5a62'; ctx.fillRect(rx, ry, rw, 2);
  ctx.fillStyle = '#e8d080'; ctx.fillRect(rx + 30, ry + 8, rw - 60, 16);
  for (let k = 0; k <= 40; k++) { ctx.fillStyle = '#333'; ctx.fillRect(rx + 30 + k * (rw - 60) / 40, ry + 8, 1, k % 5 ? 4 : 8); }
  for (const kx of [rx + 14, rx + rw - 14]) { ctx.fillStyle = '#999'; ctx.beginPath(); ctx.arc(kx, ry + 18, 9, 0, 7); ctx.fill(); ctx.fillStyle = '#666'; ctx.fillRect(kx - 1, ry + 10, 2, 7); }
  const nx = rx + 30 + (rw - 60) * (0.12 + songIdx * 0.38);
  ctx.fillStyle = '#e02020'; ctx.fillRect(nx - 1, ry + 5, 3, 22);
  SONGS.forEach((s, k) => { const sx = rx + 30 + (rw - 60) * (0.12 + k * 0.38); txt(s.freq, sx, ry + 30, k === songIdx ? '#ffd800' : '#cccccc', 8, 'center'); txt(s.name.split(' ')[0], sx, ry + 42, k === songIdx ? '#ffd800' : '#cccccc', 8, 'center'); });
  txt('PRESS ENTER / TAP', W / 2, 76, Math.floor(clockT * 2) % 2 ? '#ffffff' : '#ffd800', 8, 'center');
}

// ════════════════════════════ 사운드 (FM 신스) ════════════════════════════
// 원작 기판(YM2151 FM 음원) 느낌의 FM 신시사이저 — 곡은 저작권 때문에 같은 스타일의 오리지널 곡
let actx, engOsc = [], engFilt, engAM, engGain, musicGain, sfxGain, skidGain, squeal = [], musicOn = true, seqTimer, songIdx = 0;
const SONGS = [
  { name: 'CORAL DRIVE', freq: '87.6', bpm: 152,
    ch: ['F:maj7', 'E:m7', 'D:m7', 'C:maj7', 'Bb:maj7', 'A:m7', 'G:m7', 'C:7'],
    bass: [0, 3, 6, 8, 11, 14], oct: [6, 14], stab: [0, 3, 6, 10, 12],
    mel: [[[72, 0, 2], [76, 2, 2], [79, 4, 4], [77, 8, 2], [76, 10, 2], [74, 12, 4]], [[76, 0, 6], [74, 6, 2], [71, 8, 4], [67, 12, 4]],
          [[69, 0, 2], [72, 2, 2], [77, 4, 4], [76, 8, 2], [74, 10, 2], [72, 12, 4]], [[71, 0, 4], [72, 4, 2], [74, 6, 2], [76, 8, 8]],
          [[77, 0, 3], [74, 3, 3], [70, 6, 2], [74, 8, 2], [77, 10, 2], [81, 12, 4]], [[79, 0, 4], [76, 4, 2], [72, 6, 2], [76, 8, 8]],
          [[74, 0, 2], [77, 2, 2], [79, 4, 2], [77, 6, 2], [74, 8, 4], [70, 12, 4]], [[72, 0, 4], [70, 4, 4], [67, 8, 4], [64, 12, 4]]],
    dr: { k: 'x.....x.x.......', s: '....x.......x...', h: 'x.xxx.xxx.xxx.xx', c: '...x..x....x.x..', b: 'x..x..x...x.x...' } },
  { name: 'PALM BREEZE', freq: '92.4', bpm: 118,
    ch: ['G:maj7', 'F#:m7', 'E:m7', 'D:maj7', 'G:maj7', 'F#:m7', 'E:m7', 'A:7'],
    bass: [0, 6, 8, 12, 14], oct: [14], stab: [0, 8],
    mel: [[[74, 0, 6], [76, 6, 2], [78, 8, 4], [81, 12, 4]], [[78, 0, 8], [76, 8, 4], [73, 12, 4]],
          [[71, 0, 4], [74, 4, 4], [76, 8, 4], [78, 12, 4]], [[74, 0, 12], [73, 12, 4]],
          [[79, 0, 6], [78, 6, 2], [76, 8, 4], [74, 12, 4]], [[76, 0, 6], [73, 6, 2], [69, 8, 8]],
          [[71, 0, 3], [74, 3, 3], [76, 6, 2], [79, 8, 4], [78, 12, 4]], [[76, 0, 8], [73, 8, 4], [69, 12, 4]]],
    dr: { k: 'x.....x...x.....', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.', c: '', b: '' } },
  { name: 'SURF LINE', freq: '101.8', bpm: 166,
    ch: ['A:m', 'F:maj', 'G:maj', 'E:m', 'A:m', 'F:maj', 'G:maj', 'E:7'],
    bass: [0, 2, 4, 6, 8, 10, 12, 14], oct: [2, 6, 10, 14], stab: [0, 6, 12],
    mel: [[[76, 0, 2], [76, 3, 1], [74, 4, 2], [72, 6, 2], [74, 8, 4], [76, 12, 4]], [[77, 0, 4], [76, 4, 2], [72, 6, 2], [69, 8, 8]],
          [[74, 0, 2], [74, 3, 1], [72, 4, 2], [71, 6, 2], [72, 8, 4], [74, 12, 4]], [[71, 0, 8], [67, 8, 4], [71, 12, 4]],
          [[81, 0, 4], [79, 4, 2], [76, 6, 2], [79, 8, 4], [81, 12, 4]], [[77, 0, 4], [76, 4, 2], [72, 6, 2], [77, 8, 8]],
          [[79, 0, 2], [77, 2, 2], [76, 4, 4], [74, 8, 4], [71, 12, 4]], [[68, 0, 4], [71, 4, 4], [74, 8, 4], [76, 12, 4]]],
    dr: { k: 'x...x...x...x...', s: '....x.......x..x', h: 'xxxxxxxxxxxxxxxx', c: '', b: '..x...x...x...x.' } },
];
const PC = { C: 0, 'C#': 1, Db: 1, D: 2, Eb: 3, E: 4, F: 5, 'F#': 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11 };
const QUAL = { maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], '7': [0, 4, 7, 10], m: [0, 3, 7, 12], maj: [0, 4, 7, 12] };
const parseChord = c => { const [r, q] = c.split(':'), pc = PC[r]; return { bass: 36 + pc, notes: QUAL[q].map(iv => 55 + ((pc - 7 + 12) % 12) + iv) }; };
// FM 악기 (ratio = 모듈레이터 주파수비, index = 변조 깊이)
const INS = {
  bass:  { ratio: 1, index: 3.2, idxEnd: 0.6, mdec: 0.12, att: 0.004, dec: 0.25, sus: 0.5, vol: 0.55, type: 'sine' },
  lead:  { ratio: 1, index: 2.2, idxEnd: 1.1, mdec: 0.25, att: 0.02, dec: 0.4, sus: 0.75, vol: 0.32, type: 'sine', vib: 5.5 },
  keys:  { ratio: 2, index: 1.6, idxEnd: 0.2, mdec: 0.3, att: 0.003, dec: 0.35, sus: 0.2, vol: 0.13, type: 'sine' },
  bell:  { ratio: 3.5, index: 2.5, idxEnd: 0.1, mdec: 0.2, att: 0.002, dec: 0.25, sus: 0.0, vol: 0.12, type: 'sine' },
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function fm(midi, t, dur, ins, dest = musicGain, volMul = 1) {
  const f = mtof(midi), car = actx.createOscillator(), mod = actx.createOscillator(), mg = actx.createGain(), g = actx.createGain();
  car.type = ins.type; car.frequency.value = f; mod.frequency.value = f * ins.ratio;
  mg.gain.setValueAtTime(f * ins.index, t); mg.gain.exponentialRampToValueAtTime(Math.max(1, f * ins.idxEnd), t + ins.mdec);
  mod.connect(mg); mg.connect(car.frequency);
  if (ins.vib) { const l = actx.createOscillator(), lg = actx.createGain(); l.frequency.value = ins.vib; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.012, t + 0.3); l.connect(lg); lg.connect(car.frequency); l.start(t); l.stop(t + dur + 0.3); }
  const v = ins.vol * volMul;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + ins.att);
  g.gain.setTargetAtTime(v * ins.sus, t + ins.att, ins.dec / 3);
  g.gain.setTargetAtTime(0, t + dur, 0.06);
  car.connect(g); g.connect(dest);
  car.start(t); mod.start(t); car.stop(t + dur + 0.4); mod.stop(t + dur + 0.4);
}
let noiseBuf;
function noise(t, dur, vol, type, freq, dest = musicGain, q = 0.8) {
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(dest); src.start(t, Math.random()); src.stop(t + dur + 0.05);
}
function drum(kind, t) {
  if (kind === 'k') { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.25); }
  if (kind === 's') { noise(t, 0.14, 0.5, 'highpass', 1500); fm(55, t, 0.05, INS.bell, musicGain, 0.5); }
  if (kind === 'h') noise(t, 0.035, 0.18, 'highpass', 7500);
  if (kind === 'c') { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(340, t); o.frequency.exponentialRampToValueAtTime(230, t + 0.1); g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.2); }
  if (kind === 'b') { fm(88, t, 0.05, INS.bell, musicGain, 0.8); }
}
function initAudio() {
  if (actx) { actx.resume(); return; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let k = 0; k < nd.length; k++) nd[k] = Math.random() * 2 - 1;
  const comp = actx.createDynamicsCompressor(); comp.connect(actx.destination);
  musicGain = actx.createGain(); musicGain.gain.value = 0.22; musicGain.connect(comp);
  sfxGain = actx.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(comp);
  // 엔진: 디튠된 톱니파 + 서브 사각파 → 디스토션 → 로우패스 → 회전수에 따른 떨림(AM)
  const shaper = actx.createWaveShaper(), curve = new Float32Array(1024);
  for (let k = 0; k < 1024; k++) { const x = k / 512 - 1; curve[k] = Math.tanh(x * 3); }
  shaper.curve = curve;
  engFilt = actx.createBiquadFilter(); engFilt.type = 'lowpass'; engFilt.Q.value = 3;
  engAM = actx.createGain(); engGain = actx.createGain(); engGain.gain.value = 0;
  for (const [type, mul] of [['sawtooth', 1], ['sawtooth', 1.008], ['square', 0.5]]) {
    const o = actx.createOscillator(); o.type = type; o.mul = mul; o.connect(shaper); o.start(); engOsc.push(o);
  }
  shaper.connect(engFilt); engFilt.connect(engAM); engAM.connect(engGain); engGain.connect(sfxGain);
  const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.type = 'triangle'; lg.gain.value = 0.35; lfo.connect(lg); lg.connect(engAM.gain); lfo.start(); engOsc.lfo = lfo;
  // 타이어 스키드: 사인 2개(끼익) + 대역 노이즈
  skidGain = actx.createGain(); skidGain.gain.value = 0; skidGain.connect(sfxGain);
  const vib = actx.createOscillator(), vg = actx.createGain(); vib.frequency.value = 9; vg.gain.value = 60; vib.connect(vg); vib.start();
  for (const f of [1850, 2380]) { const o = actx.createOscillator(); o.frequency.value = f; vg.connect(o.frequency); const og = actx.createGain(); og.gain.value = 0.25; o.connect(og); og.connect(skidGain); o.start(); squeal.push(o); }
  const ns = actx.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 4;
  const ng = actx.createGain(); ng.gain.value = 0.6; ns.connect(bp); bp.connect(ng); ng.connect(skidGain); ns.start();
  startMusic();
}
function noiseBurst(dur, vol, freq = 0) {
  if (!actx) return;
  const t = actx.currentTime;
  if (freq) { noise(t, dur, vol, 'bandpass', freq, sfxGain, 0.6); return; }
  // 충돌: 저음 쿵 + 파편 노이즈 + 금속성 FM
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(30, t + dur * 0.6);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + dur + 0.1);
  noise(t, dur, vol * 0.9, 'lowpass', 1800, sfxGain);
  if (dur > 0.5) fm(47, t, 0.3, { ...INS.bell, ratio: 1.41, index: 6, vol: 0.4 }, sfxGain);
}
const cheer = () => { if (!actx) return; const t = actx.currentTime; for (let k = 0; k < 6; k++) noise(t + k * 0.12, 1.2, 0.12, 'bandpass', 900 + Math.random() * 1400, sfxGain, 1.5); };
const beep = (m, d = 0.25) => actx && fm(m, actx.currentTime, d, { ...INS.lead, vol: 0.4 }, sfxGain);
function fanfare() { if (!actx) return; const t = actx.currentTime; [72, 76, 79, 84].forEach((n, k) => fm(n, t + k * 0.09, 0.25, { ...INS.lead, vol: 0.35 }, sfxGain)); }
function startMusic() {
  clearInterval(seqTimer);
  const S = SONGS[songIdx], STEP = 60 / S.bpm / 4, chords = S.ch.map(parseChord);
  let step = 0, next = actx.currentTime + 0.1;
  seqTimer = setInterval(() => {
    while (next < actx.currentTime + 0.15) {
      const bar = Math.floor(step / 16) % chords.length, s = step % 16, C = chords[bar];
      if (S.bass.includes(s)) fm(C.bass + (S.oct.includes(s) ? 12 : 0), next, STEP * 1.8, INS.bass);
      if (S.stab.includes(s)) C.notes.forEach(n => fm(n, next, STEP * (S.stab.length > 3 ? 1.5 : 6), INS.keys));
      for (const [n, st, len] of S.mel[bar]) if (st === s) fm(n, next, STEP * len, INS.lead);
      for (const d of 'kshcb') if (S.dr[d] && S.dr[d][s] === 'x') drum(d, next);
      step++; next += STEP;
    }
  }, 25);
}
function selectSong(i) {
  songIdx = (i + SONGS.length) % SONGS.length;
  showTitle();
  if (actx) startMusic(); else initAudio();
}
function toggleMusic() { musicOn = !musicOn; if (musicGain) musicGain.gain.value = musicOn ? 0.22 : 0; }

function showTitle() {}
function updateEngine() {
  if (!actx) return;
  const r = clamp(speed / GEAR_MAX[gear], 0, 1.05), now = actx.currentTime;
  const f = (gear ? 68 : 58) + r * (gear ? 150 : 175);
  engOsc.forEach(o => o.frequency.setTargetAtTime(f * o.mul, now, 0.04));
  engOsc.lfo.frequency.setTargetAtTime(f / 4, now, 0.05);
  engFilt.frequency.setTargetAtTime(450 + r * 2600, now, 0.05);
  engGain.gain.setTargetAtTime(state === 'title' ? 0 : 0.05 + r * 0.06, now, 0.1);
  skidGain.gain.setTargetAtTime(player.skid && crashT <= 0 && state !== 'title' ? 0.12 : 0, now, 0.04);
}

// ════════════════════════════ 입력 ════════════════════════════
function startOrRestart() {
  initAudio();
  if (state === 'title' || ((state === 'over' || state === 'goal') && overT > 1.5)) {
    if (state !== 'title') reset();
    state = 'countdown'; cdT = 3.6; msgT = 0;
  }
}
function shiftGear() { if (state === 'race' && crashT <= 0) gear ^= 1; }
addEventListener('keydown', e => {
  keys[e.code] = true;
  document.body.classList.remove('touch'); fit();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (state === 'title' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) { selectSong(songIdx + (e.code === 'ArrowLeft' ? -1 : 1)); return; }
  if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') shiftGear();
  if (e.code === 'Enter') startOrRestart();
  if (e.code === 'KeyM') toggleMusic();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('touchstart', () => { if (!document.body.classList.contains('touch')) { document.body.classList.add('touch'); fit(); } }, { passive: true });
{
  const bind = (id, k) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      if (state === 'title' && (k === 'left' || k === 'right')) { selectSong(songIdx + (k === 'left' ? -1 : 1)); return; }
      touch[k] = true; el.classList.add('on');
      if (state !== 'race' && state !== 'countdown') startOrRestart();
    });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(ev, () => { touch[k] = false; el.classList.remove('on'); });
  };
  bind('tLeft', 'left'); bind('tRight', 'right'); bind('tGas', 'gas'); bind('tBrake', 'brake');
  document.getElementById('tGear').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); shiftGear(); });
}
cv.addEventListener('pointerdown', () => { if (state !== 'race' && state !== 'countdown') startOrRestart(); });

// 화면 맞추기 (원작 화면비 유지, 도트 그대로 확대)
function fit() {
  const portrait = innerHeight > innerWidth, t = document.body.classList.contains('touch');
  document.body.classList.toggle('portrait', portrait);
  const ah = t && portrait ? innerHeight * 0.62 : innerHeight, s = Math.min(innerWidth / W, ah / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit);

// ════════════════════════════ 메인 루프 ════════════════════════════
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  update(dt);
  render();
  updateEngine();
  requestAnimationFrame(frame);
}
(async () => {
  try { await Promise.race([document.fonts.load(`16px ${FONT}`), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  buildSprites();
  reset();
  fit();
  window.__game = { get state() { return state; }, get pos() { return position; }, set pos(v) { position = v; }, get x() { return playerX; }, set x(v) { playerX = v; },
    get speed() { return speed; }, set speed(v) { speed = v; }, set gear(v) { gear = v; }, get stage() { return curStage; }, get segs() { return segments.length; } };
  requestAnimationFrame(frame);
})();
</script>
