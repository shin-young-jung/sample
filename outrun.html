<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ═════════════════════════ 설정 ═════════════════════════
const SEG = 5, ROAD_W = 16, RUMBLE = 1.4, LANES = 4, GW = 420;
const STAGE_LEN = 900;     // 스테이지 세그먼트 수
const FORK = 90;           // 갈림길 전 도로가 넓어지는 구간
const LEVELS = 5;          // 5단계 × 피라미드 = 15 코스, 골 5곳 (원작 구조)
const MAXS = [55, 82];     // LOW / HIGH 최고속도 → ×3.6 km/h
const START_TIME = 75;
const EXTEND = [62, 60, 58, 56];

const T = (name, sky0, sky1, fog, g0, g1, mtn, sun, tree, leaf, dens, extra = '', night = false, o = {}) =>
  ({ name, sky: [sky0, sky1], fog, grass: [g0, g1], mtn, sun, tree, leaf, dens, extra, night, clouds: !night, ...o });
const BEACH = { bush: true, road: [0x9c9ca2, 0x97979d], rumble: [0xffffff, 0xe6e6e6] };
const THEMES = [
  T('COCONUT BEACH',    0x0a6cff, 0x3d95ff, 0xe8dfc8, 0xeee3c6, 0xe7dbbc, 0, 0, 'palm',   0x2a8a30, 0.9,  '', false, { ...BEACH, pano: 'beach' }),
  T('GATEWAY',          0x1e78f0, 0x8cc4ff, 0x8cc86a, 0x63c24e, 0x58b444, 0, 0, 'round',  0x3f9a3a, 0.3,  '', false, { pano: 'hills', gate: true }),
  T("DEVIL'S CANYON",   0x2f7fe0, 0x9cc8f0, 0xc89060, 0xc8905a, 0xbb8450, 0, 0, 'cactus', 0x4a8a3a, 0.12, 'rock', false, { pano: 'canyon', cliff: 'R' }),
  T('DESOLATION HILL',  0x3a88e0, 0xc0dcf0, 0xd8c48a, 0xd6be82, 0xcab276, 0, 0, 'round',  0x7a8a3a, 0.12, 'rock', false, { pano: 'desert' }),
  T('ALPS',             0x2a70d8, 0xc8e0f8, 0xe8eef4, 0xf2f6f8, 0xe6edf2, 0, 0, 'pine',   0x2f5e40, 0.6,  'rock', false, { pano: 'alps' }),
  T('CLOUDY MOUNTAIN',  0x8a9cb0, 0xd0d6dc, 0xc4ccd4, 0x5a8a5a, 0x527f52, 0, 0, 'pine',   0x24583a, 0.7,  '', false, { pano: 'alps', cloudy: true, fogNear: 50, fogFar: 520 }),
  T('WHEAT FIELD',      0x2f80f0, 0xb8dcff, 0xe0c870, 0xe6c45a, 0xdab852, 0, 0, 'round',  0x4a8a2a, 0.12, '', false, { pano: 'fields', windmill: true }),
  T('OLD CAPITAL',      0x3a80e0, 0xd8e8f8, 0xd8cfb8, 0xc9bd96, 0xbfb28a, 0, 0, 'pine',   0x2f5a3a, 0.25, 'column', false, { pano: 'ruins' }),
  T('WILDERNESS',       0x3a84d8, 0xe8d0a8, 0xc8a070, 0xb88a5a, 0xab7e50, 0, 0, 'cactus', 0x4a8a3a, 0.2,  'rock', false, { pano: 'canyon', cliff: 'L' }),
  T('AUTUMN FOREST',    0x3a6fc0, 0xffd7a0, 0xd8905a, 0xc8762c, 0xba6a25, 0, 0, 'round',  0xd2691e, 0.8,  '', false, { pano: 'forest' }),
  T('DEATH VALLEY',     0x4a88d0, 0xf0d8a8, 0xd8a868, 0xdcae6a, 0xd0a25e, 0, 0, 'cactus', 0x4a8a3a, 0.15, 'rock', false, { pano: 'canyon', cliff: 'both' }),
  T('DESERT',           0x2f84e8, 0xf8e0b0, 0xeed49a, 0xf0d8a0, 0xe8cf94, 0, 0, 'cactus', 0x3f8a3a, 0.25, '', false, { pano: 'desert' }),
  T('LAKESIDE',         0x2c6fd0, 0xb8e0ff, 0x9cc8a8, 0x3fa36a, 0x37945f, 0, 0, 'pine',   0x24583a, 0.6,  '', false, { pano: 'lake' }),
  T('VINEYARD',         0x3a78d8, 0xf8e2b8, 0xa8b870, 0x7a9a30, 0x6e8c2a, 0, 0, 'round',  0x5a8a20, 0.5,  '', false, { pano: 'fields', bush: true }),
  T('SUNSET COAST',     0x2a1a5e, 0xff7b54, 0xc8786a, 0xd8b890, 0xceae86, 0, 0, 'palm',   0x1f5a40, 0.7,  '', false, { ...BEACH, pano: 'beach', sunset: true }),
];
const themeIdx = (L, j) => L * (L + 1) / 2 + j;

let seed = 1986;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ═════════════════════════ 렌더러 / 씬 ═════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias: true });
// 레트로 모드: 원작(320×224)처럼 저해상도로 그린 뒤 도트 그대로 확대 — P 키로 HD 전환
let retro = true;
function applyRes() {
  const w = innerWidth, h = innerHeight;
  const pr = retro ? Math.min(1, Math.sqrt((560 * 330) / (w * h))) : Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  renderer.domElement.style.imageRendering = retro ? 'pixelated' : 'auto';
  renderer.toneMapping = retro ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
  if (typeof pMat !== 'undefined') pMat.uniforms.scale.value = h * pr * 0.9;
}
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(THEMES[0].fog, 260, 1500);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 2600);

const hemi = new THREE.HemisphereLight(0xdfefff, 0x55663a, 1.2);
scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xfff2dd, 2.4);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 300 });
sunLight.shadow.bias = -0.0005;
scene.add(sunLight, sunLight.target);

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(THEMES[0].sky[0]) }, bottom: { value: new THREE.Color(THEMES[0].sky[1]) } },
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying vec3 vP;
    void main(){ float h = clamp(vP.y * 2.2 + 0.05, 0., 1.); gl_FragColor = vec4(mix(bottom, top, pow(h, .7)), 1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(2400, 32, 16), skyMat);
scene.add(sky);

const far = new THREE.Group();
scene.add(far);
const sunDir = new THREE.Vector3(0.25, 0.16, -1).normalize();
// 원작식 2D 파노라마 배경 (코스별로 캔버스에 그려 원통에 입힘 — 커브를 돌면 원작처럼 배경이 옆으로 흐름)
const D2R = Math.PI / 180, PANO_R = 1800, PANO_TOP = 17, PANO_BOT = -3, PW = 4096, PH = 512;
const tTop = Math.tan(PANO_TOP * D2R), tBot = Math.tan(PANO_BOT * D2R);
const PANO_HY = Math.round(PH * tTop / (tTop - tBot));       // 캔버스상의 수평선 위치
function panoTex(th) {
  const c = document.createElement('canvas'); c.width = PW; c.height = PH;
  const g = c.getContext('2d'), HY = PANO_HY;
  let sd = 7 + th.name.length * 131; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const wrap = fn => { fn(0); fn(-PW); fn(PW); };
  const hex = h => '#' + h.toString(16).padStart(6, '0');
  const ridge = (base, amp, freq, color, so = 0, jag = 0) => {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, PH);
    for (let x = 0; x <= PW; x += 8) {
      const t = x / PW * Math.PI * 2;
      let y = base - amp * (0.5 + 0.3 * Math.sin(t * freq + so) + 0.2 * Math.sin(t * freq * 3 + so * 3));
      if (jag) y -= Math.abs(Math.sin(t * freq * 9 + so)) * jag;
      g.lineTo(x, y);
    }
    g.lineTo(PW, PH); g.closePath(); g.fill();
  };
  const cloudBank = (n, yBase, size, light = '#ffffff', mid = '#eef2f8', shade = '#c8d2e0') => {
    for (let k = 0; k < n; k++) {
      const cx = r() * PW, w = size * (0.6 + r() * 0.9), blobs = [];
      for (let b = 0; b < 26; b++) {
        const u = (r() - 0.5) * 2, x = cx + u * w, hgt = (1 - Math.abs(u)) * w * 0.55;
        blobs.push([x, yBase - r() * hgt - 8, 18 + r() * w * 0.16 * (1.2 - Math.abs(u))]);
      }
      wrap(off => {
        for (const [x, y, rad] of blobs) { g.fillStyle = shade; g.beginPath(); g.arc(x + off + 3, y + 6, rad, 0, 7); g.fill(); }
        for (const [x, y, rad] of blobs) {
          const gr = g.createRadialGradient(x + off - rad * 0.35, y - rad * 0.45, rad * 0.1, x + off, y, rad);
          gr.addColorStop(0, light); gr.addColorStop(0.7, mid); gr.addColorStop(1, shade);
          g.fillStyle = gr; g.beginPath(); g.arc(x + off, y, rad * 0.94, 0, 7); g.fill();
        }
      });
    }
  };
  const kind = th.pano, ground = hex(th.fog);
  if (kind === 'beach') {
    if (th.sunset) { g.fillStyle = '#ffcf70'; g.beginPath(); g.arc(PW * 0.52, HY - 40, 70, 0, 7); g.fill(); }
    cloudBank(16, HY - 10, 260, th.sunset ? '#ffd8c0' : '#ffffff', th.sunset ? '#f8a890' : '#f1f5fa', th.sunset ? '#9a5a8a' : '#c6d0de');
    const sea0 = th.sunset ? '#4a3a8a' : '#2c64e6', sea1 = th.sunset ? '#e89070' : '#5a92f4';
    g.fillStyle = sea0; g.fillRect(0, HY - 16, PW, PH);
    g.fillStyle = sea1; for (let y = HY - 14; y < PH; y += 5) for (let k = 0; k < 40; k++) g.fillRect(r() * PW, y, 10 + r() * 40, 1);
    for (let k = 0; k < 7; k++) { const x = r() * PW, w = 80 + r() * 220; g.fillStyle = th.sunset ? '#3a2a4a' : '#3f8a4a'; g.beginPath(); g.ellipse(x, HY - 16, w, 6 + r() * 8, 0, Math.PI, 0); g.fill(); }
    for (let k = 0; k < 14; k++) { const x = r() * PW, y = HY - 4 + r() * 20; g.fillStyle = '#fff'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 5, y - 16); g.lineTo(x + 10, y); g.fill(); g.fillStyle = '#c33'; g.fillRect(x - 2, y, 14, 2); }
  } else if (kind === 'hills') {
    cloudBank(9, HY - 150, 160);
    ridge(HY - 20, 90, 5, '#8cb8a0', 1);
    ridge(HY, 60, 7, '#6aaa58', 2);
    for (let k = 0; k < 60; k++) { const x = r() * PW, y = HY - 10 - r() * 30; g.fillStyle = '#3f7a34'; g.beginPath(); g.arc(x, y, 6 + r() * 8, 0, 7); g.fill(); }
    ridge(HY + 10, 26, 11, '#58a046', 3);
  } else if (kind === 'canyon') {
    cloudBank(6, HY - 230, 140);
    const mesa = (n, base, hmin, hmax, c0, c1) => {
      for (let k = 0; k < n; k++) {
        const x = r() * PW, w = 120 + r() * 380, h = hmin + r() * (hmax - hmin);
        wrap(off => {
          g.fillStyle = c0; g.beginPath(); g.moveTo(x + off - w / 2 - 30, base); g.lineTo(x + off - w / 2, base - h); g.lineTo(x + off + w / 2, base - h); g.lineTo(x + off + w / 2 + 30, base); g.fill();
          g.fillStyle = c1; g.fillRect(x + off + w * 0.15, base - h, w * 0.35, h);
          g.fillStyle = 'rgba(0,0,0,.12)'; for (let q = 1; q < 5; q++) g.fillRect(x + off - w / 2, base - h + h * q / 5, w, 3);
        });
      }
    };
    mesa(14, HY + 6, 80, 230, '#b8603a', '#d88454');
    mesa(10, HY + 6, 40, 110, '#9a4a2a', '#c06a40');
  } else if (kind === 'desert') {
    cloudBank(5, HY - 200, 130);
    ridge(HY - 6, 50, 4, '#d8a870', 4);
    for (let k = 0; k < 6; k++) { const x = r() * PW, w = 100 + r() * 160, h = 50 + r() * 70; wrap(off => { g.fillStyle = '#c47a4a'; g.fillRect(x + off - w / 2, HY - h, w, h); g.fillStyle = '#e09a62'; g.fillRect(x + off - w / 2, HY - h, w * 0.4, h); }); }
    ridge(HY + 6, 30, 9, '#e8c890', 5);
    ridge(HY + 14, 16, 15, '#dcb878', 6);
  } else if (kind === 'alps') {
    cloudBank(th.cloudy ? 18 : 7, th.cloudy ? HY - 60 : HY - 260, 180, th.cloudy ? '#e4e8ec' : '#fff', th.cloudy ? '#cdd3da' : '#eef2f8', th.cloudy ? '#a8b0ba' : '#c6d0de');
    const peaks = (n, base, hmin, hmax, rock, snow) => {
      for (let k = 0; k < n; k++) {
        const x = r() * PW, h = hmin + r() * (hmax - hmin), w = h * (1.1 + r() * 0.8);
        wrap(off => {
          const X = x + off;
          g.fillStyle = rock; g.beginPath(); g.moveTo(X - w, base); g.lineTo(X - w * 0.2, base - h * 0.85); g.lineTo(X, base - h); g.lineTo(X + w * 0.3, base - h * 0.8); g.lineTo(X + w, base); g.fill();
          g.fillStyle = snow; g.beginPath(); g.moveTo(X - w * 0.42, base - h * 0.55); g.lineTo(X - w * 0.2, base - h * 0.85); g.lineTo(X, base - h); g.lineTo(X + w * 0.3, base - h * 0.8);
          g.lineTo(X + w * 0.5, base - h * 0.5); g.lineTo(X + w * 0.25, base - h * 0.6); g.lineTo(X + w * 0.05, base - h * 0.5); g.lineTo(X - w * 0.15, base - h * 0.62); g.fill();
        });

      for (let k = 0; k < 6; k++) col.push(c.r, c.g, c.b);

    const ROAD = th.road || (th.night ? [0x4a4a52, 0x44444c] : [0x6e6e72, 0x66666a]);
    const RUM = th.rumble || [0xffffff, 0xd8262a];
    for (let i = 0; i < n; i++) {
      const alt = Math.floor(i / 3) % 2;
      const ha = this.halfW(i), hb = this.halfW(i + 1);
      const La = this.leftEnd(i), Lb = this.leftEnd(i + 1), Ra = this.rightEnd(i), Rb = this.rightEnd(i + 1);
      const rum = RUM[alt];
      quad(i, -ha, ha, -hb, hb, ROAD[alt], 0.03);
      if (La > ha + 0.05) quad(i, -Math.min(ha + RUMBLE, La), -ha, -Math.min(hb + RUMBLE, Lb), -hb, rum, 0.03);
      if (Ra > ha + 0.05) quad(i, ha, Math.min(ha + RUMBLE, Ra), hb, Math.min(hb + RUMBLE, Rb), rum, 0.03);
      if (La > ha + RUMBLE) quad(i, -La, -(ha + RUMBLE), -Math.max(Lb, hb + RUMBLE), -(hb + RUMBLE), th.grass[alt], 0);
      if (Ra > ha + RUMBLE) quad(i, ha + RUMBLE, Ra, hb + RUMBLE, Math.max(Rb, hb + RUMBLE), th.grass[alt], 0);
      if (Math.floor(i / 4) % 2 === 0)
        for (let k = 1; k < LANES; k++) {
          const fa = -1 + (2 * k) / LANES;
          quad(i, fa * ha - 0.22, fa * ha + 0.22, fa * hb - 0.22, fa * hb + 0.22, 0xf4f4f4, 0.06);
        }
      if (this.fork && i > n - FORK * 0.6) quad(i, -0.25, 0.25, -0.25, 0.25, 0xffd400, 0.06); // 분기 중앙선
      const checker = (!this.parent && i === 20) || (this.final && i === STAGE_LEN);
      if (checker) for (let k = 0; k < ROAD_W; k++) {
        const x0 = -ROAD_W + k * 2;
        quad(i, x0, x0 + 2, x0, x0 + 2, k % 2 ? 0x111111 : 0xffffff, 0.08);
      }
    }
    // 협곡 절벽 (원작 Devil's Canyon처럼 길 옆으로 솟은 바위벽)
    this.wallL = new Float32Array(n + 1); this.wallR = new Float32Array(n + 1);
    if (th.cliff) {
      const from = th.cliff === 'both' ? Math.floor(n * 0.3) : 50, to = th.cliff === 'both' ? Math.floor(n * 0.8) : (this.fork ? n - FORK - 30 : STAGE_LEN - 60);
      const sides = th.cliff === 'both' ? [-1, 1] : [th.cliff === 'L' ? -1 : 1];
      const ROCK = [0xb0603a, 0xa25834, 0x8a4a2a, 0xc87a4a, 0x7a4026];
      const vq = (i, x, ya0, ya1, yb0, yb1, hex) => {
        const a = P[i], b = P[i + 1];
        const ax = a.x + Math.cos(H[i]) * x, az = a.z + Math.sin(H[i]) * x, bx = b.x + Math.cos(H[i + 1]) * x, bz = b.z + Math.sin(H[i + 1]) * x;
        pos.push(ax, a.y + ya0, az, ax, a.y + ya1, az, bx, b.y + yb0, bz, ax, a.y + ya1, az, bx, b.y + yb1, bz, bx, b.y + yb0, bz);
        c.setHex(hex); for (let k = 0; k < 6; k++) col.push(c.r, c.g, c.b);
      };
      for (const sd of sides) {
        const hgt = i2 => (24 + 18 * Math.sin(i2 * 0.07 + sd) + 9 * Math.sin(i2 * 0.23)) * clamp(Math.min((i2 - from) / 12, (to - i2) / 12), 0, 1);
        for (let i = from; i < to; i++) {
          const xw = sd * (this.halfW(i) + RUMBLE + 5);
          (sd < 0 ? this.wallL : this.wallR)[i] = Math.abs(xw);
          const h0 = hgt(i), h1 = hgt(i + 1), band = (Math.floor(i / 2) + (sd > 0 ? 1 : 0)) % 2;
          vq(i, xw, 0, h0 * 0.35, 0, h1 * 0.35, ROCK[2 + band * 2]);
          vq(i, xw, h0 * 0.35, h0 * 0.7, h1 * 0.35, h1 * 0.7, ROCK[band]);
          vq(i, xw, h0 * 0.7, h0, h1 * 0.7, h1, ROCK[3 - band]);
        }
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();
    const road = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    road.receiveShadow = true;
    this.group.add(road);
    this.scenery();
  }

  scenery() {
    const th = this.theme, n = this.len, grp = this.group, v = new THREE.Vector3();
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sc = new THREE.Vector3();
    const startCrowd = !this.parent ? [4, 46] : null;
    const cpCrowd = this.fork ? [n - 34, n - 4] : null;
    const goalCrowd = this.final ? [STAGE_LEN - 34, STAGE_LEN + 34] : null;
    const inRange = (i, r) => r && i >= r[0] - 6 && i <= r[1] + 6;
    const freeAt = (i, x) => {
      const inner = x < 0 ? this.leftEnd(i) : this.rightEnd(i);
      return Math.abs(x) < inner - 4;
    };

    // 나무
    const trees = [];
    const startI = this.parent ? 40 : 30;
    for (let i = startI; i < n - 6; i += 6) {
      if (inRange(i, startCrowd) || inRange(i, cpCrowd) || inRange(i, goalCrowd)) continue;
      for (const side of [-1, 1]) {
        if (rnd() > th.dens) continue;
        const x = side * (this.halfW(i) + RUMBLE + 3.5 + rnd() * 16);
        if (!freeAt(i, x)) continue;
        trees.push({ i, x });
        this.obstacles.push({ s: i * SEG, x, r: th.tree === 'cactus' ? 1.3 : 1.0 });
      }
    }
    if (trees.length) {
      const T0 = TREES[th.tree];
      const trunks = new THREE.InstancedMesh(T0.trunk, new THREE.MeshStandardMaterial({ color: T0.tc, roughness: 0.9 }), trees.length);
      const crowns = new THREE.InstancedMesh(T0.crown, new THREE.MeshStandardMaterial({ color: th.tree === 'cactus' ? T0.tc : th.leaf, roughness: 0.75, flatShading: true, side: THREE.DoubleSide }), trees.length);
      trees.forEach((t, k) => {
        this.at(t.i, t.x, v);
        // 야자수는 도로 바깥쪽으로 기울어짐 (원작 구도)
        const yaw = T0.lean ? (t.x > 0 ? -this.H[t.i] : Math.PI - this.H[t.i]) + (rnd() - 0.5) * 0.9 : rnd() * 6.28;
        e.set((rnd() - 0.5) * 0.12, yaw, (rnd() - 0.5) * 0.12);
        const s = T0.lean ? 0.95 + rnd() * 0.4 : 0.8 + rnd() * 0.5;
        m4.compose(v, q.setFromEuler(e), sc.set(s, s, s));
        trunks.setMatrixAt(k, m4); crowns.setMatrixAt(k, m4);
      });
      trunks.castShadow = crowns.castShadow = true;
      grp.add(trunks, crowns);
    }

    // 길가 덤불 (해변 코스)
    if (th.bush) {
      const list = [];
      for (let i = 30; i < n - 6; i += 4) {
        if (rnd() > 0.55 || inRange(i, startCrowd) || inRange(i, cpCrowd) || inRange(i, goalCrowd)) continue;
        const side = rnd() < 0.5 ? -1 : 1, x = side * (this.halfW(i) + RUMBLE + 5 + rnd() * 40);
        if (freeAt(i, x)) list.push({ i, x });
      }
      const im = new THREE.InstancedMesh(bushGeo, new THREE.MeshStandardMaterial({ color: 0x3f9a34, roughness: 0.9, flatShading: true }), Math.max(1, list.length));
      im.count = list.length;
      list.forEach((b, k) => {
        this.at(b.i, b.x, v);
        const s = 0.9 + rnd() * 1.6;
        m4.compose(v, q.setFromEuler(e.set(0, rnd() * 6, 0)), sc.set(s, s * 0.8, s));
        im.setMatrixAt(k, m4);
      });
      im.castShadow = true;
      grp.add(im);
    }

    // Gateway: 길을 가로지르는 스톤헨지풍 거대한 돌문
    if (th.gate) {
      const stone = std(0xb6ae9c, { flatShading: true });
      for (let i = 70; i < n - FORK - 30; i += 55 + Math.floor(rnd() * 25)) {
        const hw = this.halfW(i) + RUMBLE + 3, gt = new THREE.Group();
        gt.position.copy(this.P[i]); gt.rotation.y = -this.H[i];
        for (const sx of [-1, 1]) {
          const pl = new THREE.Mesh(new THREE.BoxGeometry(3.4, 16, 3.4), stone);
          pl.position.set(sx * hw, 8, 0); pl.rotation.z = (rnd() - 0.5) * 0.05; pl.castShadow = true; gt.add(pl);
          this.obstacles.push({ s: i * SEG, x: sx * hw, r: 2 });
        }
        const lt = new THREE.Mesh(new THREE.BoxGeometry(2 * hw + 5, 3, 3.8), stone);
        lt.position.y = 17.4; lt.rotation.z = (rnd() - 0.5) * 0.03; lt.castShadow = true; gt.add(lt);
        grp.add(gt);
      }
    }
    // 밀밭 풍차
    if (th.windmill) {
      this.spinners = [];
      for (let i = 60; i < n - 40; i += 90 + Math.floor(rnd() * 60)) {
        const side = rnd() < 0.5 ? -1 : 1, x = side * (this.halfW(i) + RUMBLE + 24 + rnd() * 40);
        if (!freeAt(i, x)) continue;
        const w = new THREE.Group(); this.at(i, x, w.position); w.rotation.y = -this.H[i] + side * 0.5;
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 3, 14, 8), std(0xf0ece0)); tower.position.y = 7; tower.castShadow = true;
        const roof = new THREE.Mesh(new THREE.ConeGeometry(2.2, 3, 8), std(0x9a4a2a)); roof.position.y = 15.5;
        const hub = new THREE.Group(); hub.position.set(0, 14, 2.4);
        for (let b = 0; b < 4; b++) { const bl = new THREE.Mesh(new THREE.BoxGeometry(1.4, 9, 0.15).translate(0, 4.5, 0), std(0xe8e0cc)); bl.rotation.z = b * Math.PI / 2; bl.castShadow = true; hub.add(bl); }
        w.add(tower, roof, hub); grp.add(w); this.spinners.push(hub);
      }
    }

    // 바위 / 기둥
    if (th.extra === 'rock' || th.extra === 'column') {
      const list = [];
      for (let i = 50; i < n - 10; i += 9) {
        if (rnd() > 0.45) continue;
        const side = rnd() < 0.5 ? -1 : 1;
        const x = side * (this.halfW(i) + RUMBLE + (th.extra === 'column' ? 4 : 8) + rnd() * 30);
        if (freeAt(i, x) && !inRange(i, cpCrowd) && !inRange(i, goalCrowd)) list.push({ i, x });
      }
      const geo = th.extra === 'rock' ? rockGeo : columnGeo;
      const mat = new THREE.MeshStandardMaterial({ color: th.extra === 'rock' ? (th.pano === 'alps' ? 0x8a909a : 0xa06a44) : 0xe8e0d0, roughness: 0.95, flatShading: true });
      const im = new THREE.InstancedMesh(geo, mat, Math.max(1, list.length));
      im.count = list.length;
      list.forEach((r, k) => {
        this.at(r.i, r.x, v);
        const s = th.extra === 'rock' ? 1.5 + rnd() * 4 : 1;
        e.set(rnd() * (th.extra === 'rock' ? 3 : 0), rnd() * 6, 0);
        m4.compose(v, q.setFromEuler(e), sc.set(s, s * (0.6 + rnd() * 0.6), s));
        im.setMatrixAt(k, m4);
        this.obstacles.push({ s: r.i * SEG, x: r.x, r: th.extra === 'rock' ? s * 0.8 : 1.2 });
      });
      im.castShadow = true;
      grp.add(im);
    }

    // 광고판
    if (th.extra === 'bill') {
      const WORDS = ['TURBO', 'SUN OIL', 'COLA', 'RADIO 86', 'SURF SHOP', 'MOTEL', 'BURGER', 'GAS', 'PIZZA', 'CAMERA'];
      const COLS = ['#d8262a', '#1f5fd0', '#f0a020', '#1f9a5a', '#7a3fc0', '#111'];
      for (let i = 80; i < n - 60; i += 110 + Math.floor(rnd() * 80)) {
        const side = rnd() < 0.5 ? -1 : 1, x = side * (ROAD_W + RUMBLE + 7);
        if (!freeAt(i, x)) continue;
        const b = new THREE.Group();
        this.at(i, x, b.position);
        b.rotation.y = -this.H[i] - side * 0.35;
        const tex = textTex(WORDS[Math.floor(rnd() * WORDS.length)], COLS[Math.floor(rnd() * COLS.length)], '#fff', 512, 192, 92);
        const board = new THREE.Mesh(new THREE.BoxGeometry(9, 3.4, 0.3), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }));
        board.position.y = 5; board.castShadow = true; b.add(board);
        for (const px of [-3.2, 3.2]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4, 0.3), std(0x777777)); p.position.set(px, 2, 0); b.add(p); }
        grp.add(b);
        this.obstacles.push({ s: i * SEG, x: x - 3.2, r: 0.6 }, { s: i * SEG, x: x + 3.2, r: 0.6 });
      }
    }

    // 관중
    const people = [];
    const addCrowd = (r, rows) => {
      if (!r) return;
      for (let i = r[0]; i <= r[1]; i++) for (const side of [-1, 1]) for (let row = 0; row < rows; row++) {
        if (rnd() < 0.2) continue;
        const x = side * (this.halfW(Math.min(i, n)) + RUMBLE + 2.2 + row * 1.3 + rnd() * 0.4);
        const ii = Math.min(i, n);
        const s = ii * SEG + (rnd() - 0.5) * 3;
        people.push({ ii, x, s, side });
      }
    };
    addCrowd(startCrowd, 3); addCrowd(cpCrowd, 3); addCrowd(goalCrowd, 4);
    if (people.length) {
      const bodies = new THREE.InstancedMesh(crowdBodyGeo, crowdMat, people.length);
      const heads = new THREE.InstancedMesh(crowdHeadGeo, crowdHeadMat, people.length);
      const base = [];
      people.forEach((p, k) => {
        const smp = this.sample(p.s);
        const yaw = p.side < 0 ? -smp.th - Math.PI / 2 : -smp.th + Math.PI / 2;
        const pos = new THREE.Vector3(smp.pos.x + Math.cos(smp.th) * p.x, smp.pos.y, smp.pos.z + Math.sin(smp.th) * p.x);
        base.push({ pos, yaw: yaw + (rnd() - 0.5) * 0.6, ph: rnd() * 6.28, sp: 7 + rnd() * 5 });
        bodies.setColorAt(k, CLOTHES[Math.floor(rnd() * CLOTHES.length)]);
        heads.setColorAt(k, SKINS[Math.floor(rnd() * SKINS.length)]);
        this.obstacles.push({ s: p.s, x: p.x, r: 0.6 });
      });
      bodies.castShadow = true;
      grp.add(bodies, heads);
      this.crowds.push({ bodies, heads, base });
    }

    // 게이트
    if (!this.parent) this.gate(20, 'START', '#d8262a', true);
    if (this.fork) this.gate(n - 2, 'CHECKPOINT', '#1f5fd0');
    if (this.final) this.gate(STAGE_LEN, 'GOAL', '#d8262a');

    // 깃발맨
    if (!this.parent) {
      const f = makeFlagman(0xffffff);
      this.at(26, -(ROAD_W + RUMBLE + 1.2), f.position).y += 0.86;
      f.rotation.y = Math.PI - this.H[26];
      grp.add(f);
      this.flaggers.push(f);
      startFlagman = f;
    }
    if (this.final) for (const side of [-1, 1]) {
      const f = makeFlagman(side < 0 ? 0xd8262a : 0x1f5fd0);
      this.at(STAGE_LEN + 4, side * (ROAD_W + RUMBLE + 1.2), f.position).y += 0.86;
      f.rotation.y = Math.PI - this.H[STAGE_LEN];
      grp.add(f);
      this.flaggers.push(f);
    }
    this.obstacles.sort((a, b) => a.s - b.s);
  }

  gate(i, label, bg, lights = false) {
    const grp = new THREE.Group();
    grp.position.copy(this.P[i]); grp.rotation.y = -this.H[i];
    const hw = this.halfW(i) + 2.5;
    const postM = std(0xdddddd, { metalness: 0.5, roughness: 0.4 });
    for (const sx of [-1, 1]) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.8, 11, 0.8), postM);
      post.position.set(sx * hw, 5.5, 0); post.castShadow = true; grp.add(post);
      this.obstacles.push({ s: i * SEG, x: sx * hw, r: 0.8 });
      // 기둥 위 체커기
      const f = makeFlag(2.2, 1.4);
      f.position.set(sx * hw, 14, 0); f.rotation.y = sx < 0 ? Math.PI : 0;
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.2, 6), postM);
      pole.position.set(sx * hw, 12.6, 0);
      grp.add(pole, f);
      this.flags.push(f);
    }
    const bar = new THREE.Mesh(new THREE.BoxGeometry(2 * hw, 3, 0.5), new THREE.MeshBasicMaterial({ map: textTex(label, bg, '#fff') }));
    bar.position.y = 11; bar.castShadow = true; grp.add(bar);
    if (lights) {
      startLamps = [];
      const box = new THREE.Mesh(new THREE.BoxGeometry(5, 1.6, 0.6), std(0x111111));
      box.position.set(0, 8.7, 0.1); grp.add(box);
      for (let k = 0; k < 3; k++) {
        const lm = new THREE.MeshStandardMaterial({ color: 0x220000, emissive: 0x000000, emissiveIntensity: 2 });
        const l = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), lm);
        l.position.set((k - 1) * 1.6, 8.7, 0.45); grp.add(l);
        startLamps.push(lm);
      }
    }
    this.group.add(grp);
  }

  forkSign() {
    const [L, R] = this.children;
    let k = 1;
    while (k < L.len && Math.hypot(L.P[k].x - R.P[k].x, L.P[k].z - R.P[k].z) < 2 * (ROAD_W + RUMBLE) + 16) k++;
    const g = new THREE.Group();
    g.position.lerpVectors(L.P[k], R.P[k], 0.5);
    g.rotation.y = -(L.H[k] + R.H[k]) / 2;
    const tex = textTex(`◀ ${L.theme.name}    ${R.theme.name} ▶`, '#1f5fd0', '#fff', 1024, 160, 56);
    const board = new THREE.Mesh(new THREE.BoxGeometry(14, 2.6, 0.3), new THREE.MeshStandardMaterial({ map: tex }));
    board.position.y = 4.5; board.castShadow = true; g.add(board);
    for (const px of [-5, 5]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.35, 3.4, 0.35), std(0x888888)); p.position.set(px, 1.7, 0); g.add(p); }
    this.group.add(g);
  }

  dispose() {
    scene.remove(this.group);
    this.group.traverse(o => {
      if (o.geometry && !SHARED.has(o.geometry)) o.geometry.dispose();
      const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
      for (const m of ms) if (!SHARED.has(m)) { if (m.map && !SHARED.has(m.map)) m.map.dispose(); m.dispose(); }
    });
    this.disposed = true;
  }
}

let startLamps = [], startFlagman = null;
function buildChildren(st) {
  if (!st.fork || st.children.length) return;
  const L = new Stage(st.level + 1, st.j, st, -1), R = new Stage(st.level + 1, st.j + 1, st, 1);
  L.setSibling(R); R.setSibling(L);
  L.build(); R.build();
  st.children = [L, R];
  st.forkSign();
}
// 스테이지 경계를 넘나드는 좌표 변환
function locate(st, s, x) {
  for (let g = 0; g < 4; g++) {
    if (s < 0 && st.parent && !st.parent.disposed) { s += st.parent.len * SEG; x += st.off; st = st.parent; continue; }
    if (s >= st.len * SEG && st.children.length) { const c = x < 0 ? st.children[0] : st.children[1]; s -= st.len * SEG; x -= c.off; st = c; continue; }
    break;
  }
  return { st, s: clamp(s, 0, st.len * SEG - 0.01), x };
}
function pointOn(st, s, x, out) {
  const L = locate(st, s, x), r = L.st.sample(L.s);
  out.set(r.pos.x + Math.cos(r.th) * L.x, r.pos.y, r.pos.z + Math.sin(r.th) * L.x);
  out.th = r.th;
  return out;
}

// ═════════════════════════ 자동차 ═════════════════════════
// 단면(초타원)을 차 길이 방향으로 이어 붙여 매끈한 차체를 만듦
function loftBody(stations, seg = 32, ex = 5) {
  const pos = [], idx = [], sp = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);
  for (const [z, hw, yb, yt] of stations) {
    const mid = (yb + yt) / 2, hh = (yt - yb) / 2;
    for (let k = 0; k < seg; k++) {
      const a = (k / seg) * Math.PI * 2, sy = Math.sin(a);
      // 아랫면은 평평하게, 윗면은 둥글게
      pos.push(sp(Math.cos(a), 2 / ex) * hw, mid + (sy < 0 ? sp(sy, 0.25) : sp(sy, 2 / (ex - 1.5))) * hh, z);
    }
  }
  const L = stations.length;
  for (let s = 0; s < L - 1; s++) for (let k = 0; k < seg; k++) {
    const a = s * seg + k, b = s * seg + (k + 1) % seg, c = a + seg, d = b + seg;
    idx.push(a, b, c, b, d, c);
  }
  const f0 = stations[0], fl = stations[L - 1], cf = pos.length / 3;
  pos.push(0, (f0[2] + f0[3]) / 2, f0[0]);
  for (let k = 0; k < seg; k++) idx.push(cf, (k + 1) % seg, k);
  const cb = pos.length / 3;
  pos.push(0, (fl[2] + fl[3]) / 2, fl[0]);
  for (let k = 0; k < seg; k++) idx.push(cb, (L - 1) * seg + k, (L - 1) * seg + (k + 1) % seg);

  mesh.rotation.y = -th + yaw;
}
function animatePeople(t) {
  const stages = [cur, cur.parent, ...cur.children].filter(s => s && !s.disposed);
  for (const st of stages) {
    for (const c of st.crowds) {
      c.base.forEach((b, k) => {
        dummy.position.copy(b.pos);
        dummy.position.y += Math.max(0, Math.sin(t * b.sp + b.ph)) * 0.35;
        dummy.rotation.set(0, b.yaw + Math.sin(t * 2 + b.ph) * 0.2, Math.sin(t * b.sp * 0.5 + b.ph) * 0.08);
        dummy.updateMatrix();
        c.bodies.setMatrixAt(k, dummy.matrix); c.heads.setMatrixAt(k, dummy.matrix);
      });
      c.bodies.instanceMatrix.needsUpdate = c.heads.instanceMatrix.needsUpdate = true;
    }
    for (const f of st.flags) waveFlag(f, t + f.id, 0.35);
    if (st.spinners) for (const h of st.spinners) h.rotation.z = t * 1.2;
    for (const f of st.flaggers) {
      const arm = f.userData.armR;
      let up;
      if (f === startFlagman) up = state === 'title' || state === 'countdown' ? 1 : Math.max(0, 1 - waveT * 3);
      else up = 0.6 + 0.4 * Math.sin(t * 6);
      arm.sh.rotation.x = Math.PI * 0.95 * up + 0.3 * (1 - up);
      arm.sh.rotation.z = -0.25 + Math.sin(t * 8) * 0.25 * up;
      f.userData.armL.sh.rotation.z = 0.15;
      waveFlag(f.userData.flag, t, 0.45);
    }
  }
}
function render(dt) {
  const p = player, t = clockT;
  const th = cur.theme;
  const k = Math.min(1, dt * 0.8);
  scene.fog.color.lerp(tgt.setHex(th.fog), k);
  skyMat.uniforms.top.value.lerp(tgt.setHex(th.sky[0]), k);
  skyMat.uniforms.bottom.value.lerp(tgt.setHex(th.sky[1]), k);
  updatePano(th, dt);
  scene.fog.near += ((th.fogNear || 300) - scene.fog.near) * k;
  scene.fog.far += ((th.fogFar || 1600) - scene.fog.far) * k;
  ground.material.color.lerp(tgt.setHex(th.grass[1]), k);
  sunLight.intensity += ((th.night ? 0.5 : retro ? 2.6 : 2.4) - sunLight.intensity) * k;
  hemi.intensity += ((th.night ? 0.55 : retro ? 2.3 : 1.2) - hemi.intensity) * k;
  sunLight.color.lerp(tgt.setHex(th.sunset ? 0xffa070 : 0xfff2dd), k);

  // 플레이어 차
  const ud = playerCar.userData;
  const hop = p.crashT > 0 ? Math.abs(Math.sin(p.crashT * 3)) * 2.2 : 0;
  const bump = p.bumpT > 0 ? Math.sin(p.bumpT * 40) * 0.12 : 0;
  const rough = p.offroad && p.speed > 5 ? (Math.random() - 0.5) * 0.14 : 0;
  placeCar(playerCar, cur, p.s, p.x, -p.steer * 0.12 + p.spin, hop + rough + Math.sin(t * 40) * 0.008 * (p.speed / 82));
  playerCar.rotation.z = p.steer * 0.04 * (p.speed / MAXS[1]) + bump;
  for (const w of ud.wheels) w.rotation.x -= p.speed * dt / 0.44;
  ud.wheels[0].rotation.y = ud.wheels[1].rotation.y = -p.steer * 0.35;
  ud.steeringWheel.rotation.z = -p.steer * 1.4;
  ud.tail.emissiveIntensity = p.brake ? 4 : 1;

  // 운전자 & 동승자
  const sr = Math.min(1, p.speed / MAXS[1]);
  const drv = ud.driver, pas = ud.pass;
  animateHair(pas, t, sr);
  animateHair(drv, t, sr);
  drv.userData.armL.sh.rotation.set(1.15, 0, 0.15 + p.steer * 0.25);
  drv.userData.armR.sh.rotation.set(1.15, 0, -0.15 + p.steer * 0.25);
  drv.userData.armL.el.rotation.x = drv.userData.armR.el.rotation.x = 0.35;
  drv.userData.head.rotation.z = -p.steer * 0.08;
  drv.rotation.z = pas.rotation.z = -p.steer * 0.12 * sr; // 코너링 시 몸이 쏠림
  const waving = (msgT > 0 && msg.textContent === 'EXTENDED PLAY!') || state === 'goal';
  pas.userData.armR.sh.rotation.set(waving ? 2.9 : 0.4, 0, waving ? -0.3 + Math.sin(t * 14) * 0.35 : -0.1);
  pas.userData.armR.el.rotation.x = waving ? 0.2 : 0.6;
  pas.userData.armL.sh.rotation.set(0.4, 0, 0.1);
  pas.userData.armL.el.rotation.x = 0.6;
  pas.userData.head.rotation.y = Math.sin(t * 0.7) * 0.3;
  // 큰 사고 → 두 사람이 차 밖으로 튕겨 나감 (원작 연출)
  if (p.crashT > 0) {
    const ct = 1 - p.crashT / 2.6, out = Math.min(1, ct * 2.2), arc = Math.sin(Math.min(1, ct * 1.6) * Math.PI) * 2.6;
    for (const [f, side] of [[drv, -1], [pas, 1]]) {
      f.position.set(f.userData.base.x + side * 2.6 * out, f.userData.base.y + arc - (ct > 0.6 ? 0.5 : 0), f.userData.base.z + 1.6 * out);
      f.rotation.x = ct < 0.6 ? ct * 12 : -0.3;
    }
  } else for (const f of [drv, pas]) { f.position.copy(f.userData.base); f.rotation.x = 0; }

  for (const tr of traffic) {
    if (!tr.active) continue;
    placeCar(tr.mesh, cur, tr.s, tr.x, 0);
    for (const w of tr.mesh.userData.wheels) w.rotation.x -= tr.speed * dt / 0.42;
  }

  // 모래먼지 / 잔디 / 타이어 연기
  if (p.speed > 6 && state !== 'title') {
    for (const sx of [-1.08, 1.08]) {
      playerCar.localToWorld(_w.set(sx, 0.15, 1.7));
      const fwdX = Math.sin(-playerCar.rotation.y), fwdZ = -Math.cos(playerCar.rotation.y);
      if (p.offroad) {
        for (let n = 0; n < 2; n++)
          emit(_w, -fwdX * 4 + (Math.random() - 0.5) * 5 + sx * 2, 1.5 + Math.random() * 3.5, -fwdZ * 4 + (Math.random() - 0.5) * 5,
               Math.random() < 0.6 ? th.grass[0] : 0xe8d8b0, 0.7, 2.6, 1.1, 0.75);
      } else if (p.skid > 0.2) {
        emit(_w, (Math.random() - 0.5) * 2, 0.8 + Math.random(), (Math.random() - 0.5) * 2, 0xdddddd, 0.6, 2.2, 1.0, 0.45 * p.skid);
      } else if (Math.random() < 0.15 * sr) {
        emit(_w, (Math.random() - 0.5), 0.4, (Math.random() - 0.5), 0xbbbbbb, 0.3, 1.2, 0.5, 0.18);
      }
    }
  }
  if (p.crashT > 1.4 && Math.random() < 0.6) { playerCar.localToWorld(_w.set(0, 0.2, 0)); emit(_w, (Math.random() - 0.5) * 6, 2 + Math.random() * 3, (Math.random() - 0.5) * 6, th.grass[0], 0.6, 1.6, 1.0, 0.45); }
  // 골 꽃가루
  if (state === 'goal' && overT < 8) {
    const CONF = [0xff3b3b, 0xffd400, 0x2a62d8, 0x1f9a5a, 0xff7ab0, 0xffffff];
    for (let n = 0; n < 4; n++) {
      pointOn(cur, STAGE_LEN * SEG + (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, _w); _w.y += 12 + Math.random() * 4;
      emit(_w, (Math.random() - 0.5) * 3, -1, (Math.random() - 0.5) * 3, CONF[n % CONF.length], 0.22, 0, 4, 1, 0.6);
    }
  }
  updateParticles(dt);
  animatePeople(t);

  // 카메라
  const camX = p.x * 0.88;
  pointOn(cur, p.s - 9.5, camX, tmpV); tmpV.y += 3.6;
  pointOn(cur, p.s + 14, camX, tmpL); tmpL.y += 1.4;
  if (state === 'title') { // 타이틀: 차 주변을 천천히 도는 카메라
    const a = t * 0.25, c = playerCar.position;
    tmpV.set(c.x + Math.sin(a) * 9, c.y + 3, c.z + Math.cos(a) * 9); tmpL.copy(c); tmpL.y += 1;
  }
  if (p.crashT > 0 || p.bumpT > 0) camShake = 0.35;
  camShake *= Math.pow(0.02, dt);
  tmpV.x += (Math.random() - 0.5) * camShake; tmpV.y += (Math.random() - 0.5) * camShake;
  camera.position.copy(tmpV);
  camera.lookAt(tmpL);
  const baseFov = camera.aspect < 1 ? 80 : 58; // 세로 화면에서는 시야를 넓게
  camera.fov += ((baseFov + sr * 14) - camera.fov) * Math.min(1, dt * 3);
  camera.updateProjectionMatrix();

  sky.position.copy(camera.position);
  far.position.set(camera.position.x, camera.position.y, camera.position.z);
  ground.position.set(camera.position.x, playerCar.position.y - 48, camera.position.z);
  sunLight.position.copy(playerCar.position).addScaledVector(sunDir, 120).add(_w.set(30, 60, 0));
  sunLight.target.position.copy(playerCar.position);

  renderer.render(scene, camera);
}

// ═════════════════════════ HUD ═════════════════════════
const tachoBars = [...document.querySelectorAll('#tacho i')];
function hud() {
  $('score').textContent = Math.floor(score).toLocaleString();
  $('time').textContent = Math.ceil(time);
  $('time').style.color = time < 10 && state === 'race' && Math.floor(time * 4) % 2 ? '#ff3030' : '#ffd400';
  $('speed').textContent = Math.round(player.speed * 3.6);
  $('gear').textContent = player.gear ? 'HIGH' : 'LOW';
  $('gear').style.color = player.gear ? '#ff4040' : '#fff';
  $('stage').textContent = cur.level + 1;
  const lt = lapT;
  $('lap').textContent = `${Math.floor(lt / 60)}'${String(Math.floor(lt % 60)).padStart(2, '0')}"${String(Math.floor((lt % 1) * 100)).padStart(2, '0')}`;
  const rpm = clamp(player.speed / MAXS[player.gear], 0, 1), lit = Math.round(rpm * tachoBars.length);
  tachoBars.forEach((b, k) => (b.style.background = k < lit ? (k > 16 ? '#ff4040' : k > 11 ? '#ffd800' : '#5cff8a') : 'rgba(190,190,210,.55)'));
}
function updateEngine() {
  if (!actx) return;
  const r = clamp(player.speed / MAXS[player.gear], 0, 1.05), now = actx.currentTime;
  const f = (player.gear ? 68 : 58) + r * (player.gear ? 150 : 175);   // 기어 변속 시 회전음이 툭 떨어짐
  engOsc.forEach(o => o.frequency.setTargetAtTime(f * o.mul, now, 0.04));
  engOsc.lfo.frequency.setTargetAtTime(f / 4, now, 0.05);
  engFilt.frequency.setTargetAtTime(450 + r * 2600, now, 0.05);
  engGain.gain.setTargetAtTime(state === 'title' ? 0 : 0.05 + r * 0.06, now, 0.1);
  skidGain.gain.setTargetAtTime(player.skid > 0.2 && state !== 'title' ? 0.12 * player.skid : 0, now, 0.04);
}

// ═════════════════════════ 루프 ═════════════════════════
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  render(dt);
  hud();
  updateEngine();
  requestAnimationFrame(loop);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  applyRes();
});
applyRes();
reset();
showTitle();
window.__game = { player, get state() { return state; }, get cur() { return cur; }, keys };
loop();
</script>
